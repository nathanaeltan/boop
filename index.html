<!doctype html>
<html lang="en">
<head>

<style>
/* A board book you can hold: one sheet of paper, painted dots, a line of pen lettering at the foot. */

#sound { top: calc(6px + env(safe-area-inset-top, 0px)); right: calc(8px + env(safe-area-inset-right, 0px)); }
#next { bottom: calc(10px + env(safe-area-inset-bottom, 0px)); right: calc(10px + env(safe-area-inset-right, 0px)); opacity: .85; animation: nudge 1.4s ease-in-out infinite; }

#t1 { bottom: calc(50% + 15vmin); }
#t2 { top: calc(50% + 15vmin); }
#grownups {
  position: absolute; left: 0; right: 0; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  margin: 0; padding-inline: 24px; text-align: center; color: #B3262E;
  font-size: clamp(14px, 2.5vmin, 21px); letter-spacing: .06em; text-wrap: balance;
}
#start { position: fixed; inset: 0; width: 100%; height: 100%; background: none; border: 0; cursor: pointer; }
#start:focus-visible { outline: none; }
</style>
</head>
<body>
<canvas id="stage" aria-label="Painted dots to tap, tilt, clap at and blow on"></canvas>
<div id="caption" aria-live="polite"></div>
<div id="cover">
  <h1 id="t1">Boop</h1>
  <h1 id="t2">the dot</h1>
  <p id="grownups">Grown-ups: tap the dot, then say yes so the dots can feel tilts and hear claps.</p>
</div>
<button id="start" aria-label="Start the game"></button>
<button id="sound" class="icon-btn" aria-label="Turn sound off">
  <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.2 4.3 18l5 .2 6.4 5.3-.3-17.2-6 5.6z"/><path id="wave" d="M19.5 11c1.6 2.4 1.6 5.4 0 8M23 8c2.9 4.2 2.9 9.8 0 14"/><path id="mute" d="M20 11.5l6 7M26 11.5l-6 7" hidden/></svg>
</button>
<button id="next" class="icon-btn" aria-label="Next page" hidden>
  <svg width="58" height="34" viewBox="0 0 58 34" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18.4c14-1.6 31-1.2 50-.9"/><path d="M42.6 8.2c3.6 3.8 7.2 7 10.8 9.4-3.8 2.4-7.4 5.2-10.2 8.6"/></svg>
</button>

<script>
'use strict';
const $ = id => document.getElementById(id);
const canvas = $('stage'), ctx = canvas.getContext('2d');
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);

const hypot = Math.hypot;
const TAU = Math.PI * 2;

/* ---------- paint ---------- */
const PAINT = { red: '#D6202E', yellow: '#F5C31C', blue: '#5AA3DB' };
const COLORS = ['red', 'yellow', 'blue'];

function seeded(a) {

}
function shade(hex, k) {

// One gouache dot: a slightly wonky outline, circular brush drag, dry white streaks, a pale rim where the paint pooled.

    const t = i / 200 * TAU;

}
const SPRITES = {};
COLORS.forEach((n, i) => { SPRITES[n] = [0, 1, 2].map(v => paintDot(PAINT[n], 11 + i * 17 + v * 101)); });

/* ---------- screen ---------- */
let W = 0, H = 0, U = 0, DPR = 1;
const paper = document.createElement('canvas');
const dark = document.createElement('canvas');
function buildPaper() {

  g.fillStyle = '#FBFAF6'; g.fillRect(0, 0, paper.width, paper.height);
  const rnd = seeded(7), n = Math.floor(W * H / 420);

    g.fillRect(rnd() * paper.width, rnd() * paper.height, 1 + rnd() * 2 * DPR, 1 + rnd() * 2 * DPR);
  }
}
// The black layer is kept at normal resolution: it is soft paint, and re-erasing a full-detail layer every frame made the page stutter.
function buildDark() {
  dark.width = W; dark.height = H;
  const g = dark.getContext('2d');
  g.globalCompositeOperation = 'source-over';
  g.fillStyle = '#111215'; g.fillRect(0, 0, W, H);

    g.strokeStyle = `rgba(255,255,255,${rand(.01, .04)})`; g.lineWidth = rand(1, 5);
    const y = rand(H); g.beginPath(); g.moveTo(0, y); g.lineTo(W, y + rand(-40, 40)); g.stroke();
  }
}
// Where the mic is on the screen right now, and which way it faces from the middle of the page. An iPad has it on its top edge and an iPhone on its bottom edge, wherever those have turned to.
function micSpot() {
  const a = screenAngle() * Math.PI / 180, flip = /iPhone/.test(navigator.userAgent) ? -1 : 1;
  const ux = -Math.sin(a) * flip, uy = -Math.cos(a) * flip;

// Three chalk marks pointing at the mic, so children know where to aim. `gap` is how far from the edge they stop.
function drawMicHint(color, alpha, gap = 0) {
  if (alpha <= 0) return;
  const m = micSpot(), size = U * .026, sideX = -m.uy, sideY = m.ux, bob = Math.sin(pageT * 4) * U * .008;
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = U * .007; ctx.lineCap = ctx.lineJoin = 'round';
  for (let i = 0; i < 3; i++) {
    const back = gap + U * (.05 + i * .036) + bob, x = m.x - m.ux * back, y = m.y - m.uy * back;
    const tailX = x - m.ux * size, tailY = y - m.uy * size;
    ctx.globalAlpha = alpha * (1 - i * .28);
    ctx.beginPath();
    ctx.moveTo(tailX + sideX * size, tailY + sideY * size); ctx.lineTo(x, y); ctx.lineTo(tailX - sideX * size, tailY - sideY * size);
    ctx.stroke();
  }

}
// The dark peels away from the mic: a soft-edged wave with dry-brush scratches along its front.
function peelDark(progress, fade, scratches) {
  const m = micSpot(), back = (Math.abs(m.ux) * W + Math.abs(m.uy) * H) * .12, cx = m.x + m.ux * back, cy = m.y + m.uy * back;
  const g = dark.getContext('2d'), far = hypot(Math.max(cx, W - cx), Math.max(cy, H - cy)) * 1.1, inward = Math.atan2(-m.uy, -m.ux);

    g.strokeStyle = `rgba(0,0,0,${rand(.35, .9)})`; g.lineWidth = rand(.8, 3.5);
    g.beginPath(); g.arc(cx, cy, Math.max(1, front + rand(-U * .14, U * .05)), s, s + span); g.stroke();

}
function scrapeAt(x0, y0, x1, y1) {
  const g = dark.getContext('2d');
  g.globalCompositeOperation = 'destination-out'; g.lineCap = 'round';
  g.strokeStyle = 'rgba(0,0,0,.9)'; g.lineWidth = U * .09;

}
function area() {

}
// iOS will not let a web page lock its rotation, so on the tilting pages the game turns itself back the other way instead.
let heldAngle = null;
function screenAngle() { return window.orientation !== undefined ? window.orientation : (screen.orientation ? screen.orientation.angle : 0); }

/* ---------- sound ---------- */
const NOTES = { red: [196, 261.6, 293.7], yellow: [329.6, 392, 440], blue: [523.3, 587.3, 659.3] };

  note(color) { const f = pick(NOTES[color] || NOTES.yellow); this.tone(f, .4, .24); this.tone(f * 2, .16, .07, 'triangle'); },
  plop() {

  pop() {

/* ---------- ears ---------- */
const ear = {
  live: false, an: null, level: 0, blow: 0, voice: 0, sustain: 0, floor: .005, avg: .005,
  flat: 0, cand: null, refractory: 0, onClap: null, rms: 0, last: 0,

async function openMic() {

    const stream = await navigator.mediaDevices.getUserMedia({ audio: {

/* ---------- tilt and shake ---------- */

    this.singing += (sing - this.singing) * Math.min(1, dt * 6);
    this.grow = clamp(this.grow + (sing > 0 ? sing * dt / 2.4 : -dt * .04), 0, 1);
    this.sun.tr = U * .09 + (this.max - U * .09) * this.grow;
    const p = this.place(this.sun.tr);
    this.sun.hx = p.x; this.sun.hy = p.y;
    if (sing > 0) {
      this.sun.wob = .1;
      // Rings of sound leave the sun in one direction, out across the page.
      this.waveDebt += dt * 5;
      if (this.waveDebt >= 1) { this.waveDebt = 0; this.waves.push({ r: this.sun.r, life: 1, power: sing }); }
    }
    if (this.grow >= 1) { this.done = true; audio.cheer(); say('What a big voice!'); next(1.8); }
  },
  drawOver() {
    if (!this.sun) return;
    const p = this.place(this.sun.r), inward = Math.atan2(-p.uy, -p.ux);
    ctx.save();
    ctx.strokeStyle = '#17171A'; ctx.lineCap = 'round';
    for (const w of this.waves) {
      ctx.globalAlpha = w.life * .7; ctx.lineWidth = U * (.004 + .006 * w.power) * (.4 + w.life);
      ctx.beginPath(); ctx.arc(this.sun.x, this.sun.y, w.r, inward - .7, inward + .7); ctx.stroke();
    }
    ctx.restore();
    if (!this.done) drawMicHint('#17171A', clamp(1 - this.singing * 3, 0, 1) * clamp(1 - this.grow * 3, 0, 1) * .8, hypot(micSpot().x - this.sun.x, micSpot().y - this.sun.y) + this.sun.r + U * .02);
  }
};
const CLAP_WORDS = ['Clap!', 'Again!', 'One more!', 'Bigger! Keep going!', 'Louder!'];
const clapPage = {
  text: 'The dots love a party. Clap your hands!', arrow: 18,
  enter() { this.n = 0; this.done = false; this.layout(); },
  layout() {
    const R = .06 * Math.pow(1.3, this.n);
    this.ds = arrange(scatterSpecs(['red', 'yellow', 'blue', 'blue', 'red', 'yellow', 'yellow', 'red', 'blue'], R, 9));
  },
  clap() {
    if (this.done) return;
    this.n++;
    if (this.n >= 5) audio.cheer(); else audio.clapTone(this.n - 1);
    for (const d of live()) { d.vy -= U * 2.2 * rand(.7, 1.2); d.vx += rand(-1, 1) * U * .6; squish(d, 1.2); }
    this.layout();
    if (this.n >= 5) { this.done = true; next(1.2); }
    else say(CLAP_WORDS[this.n]);
  },
  tap(d) { if (d && (!ear.live || pageT > 12)) this.clap(); }
};
const popPage = {
  text: 'Too big! They are going to burst! Pop them, pop them!', arrow: 24,
  enter() { this.done = false; this.layout(); },
  layout() {},
  tick() { hintWobble(live()); },
  tap(d) {
    if (!d || this.done) return;
    popDot(d);
    if (!live().length) { this.done = true; audio.cheer(); next(.9); }
  }
};
const endPage = {
  text: 'Ta-da! All gone. What now?',
  enter() { this.layout(); },
  layout() {
    const A = area(), wide = A.w > A.h * .9;
    [this.again, this.play] = arrange([
      { color: 'yellow', x: A.w * (wide ? .32 : .5), y: A.y + A.h * (wide ? .46 : .28), r: U * .11 },
      { color: 'blue', x: A.w * (wide ? .68 : .5), y: A.y + A.h * (wide ? .46 : .68), r: U * .11 }]);
  },
  tap(d) {
    if (d === this.again) { audio.plop(); go(1); }
    if (d === this.play) { audio.plop(); go(pages.indexOf(playPage)); }
  },
  drawOver() {
    ctx.fillStyle = '#17171A'; ctx.textAlign = 'center';
    ctx.font = `${Math.round(clamp(U * .036, 17, 30))}px ${getComputedStyle(document.documentElement).getPropertyValue('--hand')}`;
    for (const [d, t] of [[this.again, 'START OVER'], [this.play, 'PLAY']]) {
      if (d && !d.dead) ctx.fillText(t, d.x, d.y + d.r + U * .055);
    }
  }
};
const playPage = {
  text: 'Your turn! Tap to add dots. Tip, wiggle, clap and blow.', drag: true,
  enter() { this.c = 0; this.t = 0; live().forEach(d => { d.free = true; }); },
  layout() {},
  tap(d, x, y) {
    if (d) { popDot(d); return; }
    const color = COLORS[this.c++ % 3];
    const n = makeDot(color, x, y, U * rand(.045, .1)); n.free = true; dots.push(n);
    audio.note(color);
    const ds = live(); if (ds.length > 36) popDot(ds[0], true);
  },
  clap() { for (const d of live()) { d.free = true; d.vy -= U * 2.4 * rand(.7, 1.2); d.vx += rand(-1, 1) * U * .7; squish(d); } audio.clapTone(this.claps = (this.claps || 0) + 1); },
  shake() { live().forEach(d => release(d, 1.3)); },
  tick(dt) {
    this.t += dt;
    const push = Math.max(ear.blow, keysHeld.KeyB ? .9 : 0);
    if (push > 0) for (const d of live()) { d.free = true; d.vx += rand(-.5, 1) * push * U * 6 * dt; d.vy += rand(-1, .2) * push * U * 6 * dt; }
    $('next').hidden = false;
  },
  nextTo: 0
};

const pages = [
  { text: '', cover: true, enter() { this.layout(); }, layout() {
      arrange([{ color: 'yellow', x: W / 2, y: H / 2, r: U * .1 }]);
    }, tick() { hintWobble(live()); } },
  boopPage('Hello, little dot. Give it a boop.', 1),
  boopPage('Oh! A friend. One more boop.', 2),
  tickleOnce('Tickle the dot with the arrow. Round and round.', 0, 'red', ['yellow', 'yellow', 'yellow']),
  tickleOnce('Hee hee! It went red. Now tickle the dot with the arrow.', 2, 'blue', ['red', 'yellow', 'yellow']),
  fillPage,
  wigglePage,
  leanPage('Hold it flat like a tray. Now tip it to the left. Wheee!', -1),
  leanPage('Now tip it gently over to the right.', 1),
  huntPage('Can you find every blue one? Boop it away!', 'blue'),
  huntPage('Now every red one.', 'red'),
  mixPage('Slide the blue one onto the yellow one.', 'blue', 'yellow', 'Look! Green!'),
  mixPage('Now slide the red one onto the blue one.', 'red', 'blue', 'Purple! Who knew?'),
  mixPage('And the yellow one onto the red one.', 'yellow', 'red', 'Orange! You are a painter.'),
  nightPage, singPage, clapPage, popPage, endPage, playPage
];

function go(i) {
  if (page && page.exit) page.exit();
  if (!!pages[i].motion !== (heldAngle !== null)) { heldAngle = pages[i].motion ? screenAngle() : null; resize(); }
  page = pages[i]; pageIndex = i; pageT = 0; idleT = 0; timers = [];
  $('next').hidden = true;
  $('caption').textContent = '';
  $('cover').hidden = !page.cover; $('start').hidden = !page.cover;
  if (page.text) $('caption').textContent = page.text;
  if (page.enter) page.enter();
}
let pageIndex = 0, started = false;
function next(delay = 0) { const i = pageIndex; timers.push({ t: delay, fn: () => { if (pageIndex === i) go((i + 1) % pages.length); } }); }

/* ---------- touch ---------- */
const pointers = new Map();
function hit(x, y) {
  const ds = live();
  for (let i = ds.length - 1; i >= 0; i--) {
    const d = ds[i];
    if (hypot(d.x - x, d.y - y) < Math.max(d.r * 1.12, 34)) return d;
  }
  return null;
}
// Where a finger is on the game's own page, which is not where it is on the screen while the game is turned back.
function touchAt(e) {
  const turn = heldTurn();
  if (!turn) return { x: e.clientX, y: e.clientY };
  const a = -turn * Math.PI / 180, dx = e.clientX - window.innerWidth / 2, dy = e.clientY - window.innerHeight / 2;
  return { x: W / 2 + dx * Math.cos(a) - dy * Math.sin(a), y: H / 2 + dx * Math.sin(a) + dy * Math.cos(a) };
}
canvas.addEventListener('pointerdown', e => {
  audio.init(); idleT = 0; reviveMic();
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* finger already lifted */ }
  const { x, y } = touchAt(e);
  const d = hit(x, y);
  pointers.set(e.pointerId, { dot: d, x, y, x0: x, y0: y, t: performance.now(), moved: 0 });
  if (d) {
    squish(d); audio.note(d.color);
    if (page.drag === true || d.free) { d.held++; d.vx = d.vy = 0; }
  }
});
canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId); if (!p) return;
  idleT = 0;
  const { x, y } = touchAt(e);
  const dist = hypot(x - p.x, y - p.y); p.moved += dist;
  if (typeof page.drag === 'function') page.drag(p.x, p.y, x, y);
  const d = p.dot;
  if (d && d.held) {
    d.vx = (x - p.x) * 30; d.vy = (y - p.y) * 30;
    d.x = x; d.y = y; d.hx = d.x; d.hy = d.y;
  } else if (page.rub) {
    const over = hit(x, y);
    if (over) page.rub(over, dist);
  }
  p.x = x; p.y = y;
});
function endPointer(e) {
  const p = pointers.get(e.pointerId); if (!p) return;
  pointers.delete(e.pointerId);
  if (p.dot && p.dot.held) p.dot.held--;
  const { x, y } = touchAt(e);
  if (p.moved < 14 && performance.now() - p.t < 650 && page.tap) page.tap(p.dot && !p.dot.dead ? p.dot : null, x, y);
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', e => { const p = pointers.get(e.pointerId); if (p && p.dot && p.dot.held) p.dot.held--; pointers.delete(e.pointerId); });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());

// Sensor permission prompts on iPhone and iPad only open from a real click, so the cover is one big button.
$('start').addEventListener('click', () => {
  audio.init();
  if (started) { $('start').hidden = true; audio.plop(); go(1); return; }
  started = true;
  const asks = [];
  if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) asks.push(DeviceOrientationEvent.requestPermission().catch(() => 'denied'));
  if (window.DeviceMotionEvent && DeviceMotionEvent.requestPermission) asks.push(DeviceMotionEvent.requestPermission().catch(() => 'denied'));
  $('start').hidden = true;
  Promise.all(asks).then(() => { sense.listen(); return openMic(); }).finally(() => {
    if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {});
    audio.plop();
    go(1);
  });
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (audio.ctx && audio.ctx.state !== 'running') audio.ctx.resume().catch(() => {});
  setTimeout(reviveMic, 600);
  if (navigator.wakeLock && pageIndex) navigator.wakeLock.request('screen').catch(() => {});
});
$('sound').addEventListener('click', () => {
  audio.on = !audio.on;
  $('wave').toggleAttribute('hidden', !audio.on); $('mute').toggleAttribute('hidden', audio.on);
  $('sound').setAttribute('aria-label', audio.on ? 'Turn sound off' : 'Turn sound on');
});
$('next').addEventListener('click', () => {
  audio.init();
  if (page === playPage) go(0); else go((pageIndex + 1) % pages.length);
});

/* Keyboard stands in for the sensors on a computer: arrows tip, S wiggles, C claps, hold B to blow, hold V to sing. */
const keysHeld = {};
window.addEventListener('keydown', e => {
  sense.keys[e.key] = true; keysHeld[e.code] = true;
  if (e.repeat) return;
  if (e.code === 'KeyS') triggerShake();
  if (e.code === 'KeyC') triggerClap();
});
window.addEventListener('keyup', e => { sense.keys[e.key] = false; keysHeld[e.code] = false; });
function triggerShake() {
  if (!page || page.cover) return;
  audio.rattle();
  live().forEach(d => { d.wob = .35; });
  if (page.shake) page.shake();
}
function triggerClap() { if (page && page.clap) page.clap(); }
sense.onShake = triggerShake;
ear.onClap = triggerClap;

/* ---------- loop ---------- */
let lastT = 0;
function frame(now) {
  requestAnimationFrame(frame); // Booked first, so one bad frame can never freeze the game for good.
  const dt = Math.min(1 / 30, (now - lastT) / 1000 || 1 / 60); lastT = now;
  pageT += dt; idleT += dt;
  for (const t of timers) { t.t -= dt; }
  const due = timers.filter(t => t.t <= 0); timers = timers.filter(t => t.t > 0);
  due.forEach(t => t.fn());
  ear.update(now);
  if (page && page.tick) page.tick(dt);
  if (page) {
    // The black fades smoothly over the last stretch of blowing, not all at once at the end.
    const clearing = clamp((scraped - .7) / .3, 0, 1);
    const wantDark = page.night ? 1 - clearing * clearing * (3 - 2 * clearing) : 0;
    nightAlpha += (wantDark - nightAlpha) * Math.min(1, dt * 3);
    if (page.arrow && pageT > page.arrow && !page.done && $('next').hidden) $('next').hidden = false;
  }
  if (sense.jolt > 4 && live().some(d => d.free)) {
    for (const d of live()) if (d.free) { d.vx += rand(-1, 1) * sense.jolt * U * .02; d.vy += rand(-1, 1) * sense.jolt * U * .02; }
  }
  sense.jolt *= .6;
  step(dt);
  draw(now);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();
go(0);
for (let i = 0; i < 40; i++) step(1 / 60);
draw(0);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (page && page.layout) page.layout(); });
requestAnimationFrame(frame);

try {
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
} catch (e) { /* offline play is a bonus; the game runs without it */ }
window.boop = { ear, sense, audio, go, get page() { return page; }, get index() { return pageIndex; }, get dots() { return dots; }, get scraped() { return scraped; }, pages };
</script>
</body>
</html>
