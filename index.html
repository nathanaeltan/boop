<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Boop the Dot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Boop">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBFAF6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light+Two&display=swap">
<style>
/* A board book you can hold: one sheet of paper, painted dots, a line of pen lettering at the foot. */
:root {
  color-scheme: light;
  --paper: #FBFAF6;
  --ink: #17171A;
  --night: #111215;
  --chalk: #F4F2EC;
  --title: #2A55A8;
  --hand: "Shadows Into Light Two", "Bradley Hand", "Noteworthy", "Comic Sans MS", cursive;
}
html, body {
  height: 100%; margin: 0; overflow: hidden; background: var(--paper);
  overscroll-behavior: none; touch-action: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
body.night { background: var(--night); }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#caption {

  padding: 10px max(20px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  text-align: center; text-wrap: balance; color: var(--ink); pointer-events: none;
  font: 400 clamp(19px, 3.7vmin, 34px)/1.28 var(--hand);
  letter-spacing: .07em; text-transform: uppercase;
  transition: opacity .25s, color .5s, text-shadow .5s;
}
#caption.fade { opacity: 0; }
body.night #caption { color: var(--chalk); text-shadow: 0 0 3px var(--night), 0 0 9px var(--night), 0 0 16px var(--night); }
.icon-btn {

  opacity: .55; cursor: pointer; touch-action: manipulation; transition: color .5s, opacity .3s;
}
.icon-btn:focus-visible { outline: 2px dashed currentColor; outline-offset: 2px; }
body.night .icon-btn { color: var(--chalk); }
#sound { top: calc(6px + env(safe-area-inset-top, 0px)); right: calc(8px + env(safe-area-inset-right, 0px)); }
#next { bottom: calc(10px + env(safe-area-inset-bottom, 0px)); right: calc(10px + env(safe-area-inset-right, 0px)); opacity: .85; animation: nudge 1.4s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateX(7px); } }
#cover { position: fixed; inset: 0; pointer-events: none; color: var(--title); font-family: var(--hand); text-transform: uppercase; }
#cover h1 { position: absolute; left: 0; right: 0; margin: 0; text-align: center; font-weight: 400; font-size: clamp(54px, 15vmin, 150px); letter-spacing: .12em; line-height: 1; }
#t1 { bottom: calc(50% + 15vmin); }
#t2 { top: calc(50% + 15vmin); }
#grownups {
  position: absolute; left: 0; right: 0; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  margin: 0; padding-inline: 24px; text-align: center; color: #B3262E;
  font-size: clamp(14px, 2.5vmin, 21px); letter-spacing: .06em; text-wrap: balance;
}
#start { position: fixed; inset: 0; width: 100%; height: 100%; background: none; border: 0; cursor: pointer; }
#start:focus-visible { outline: none; }
</style>
</head>
<body>
<canvas id="stage" aria-label="Painted dots to tap, tilt, clap at and blow on"></canvas>
<div id="caption" aria-live="polite"></div>
<div id="cover">
  <h1 id="t1">Boop</h1>
  <h1 id="t2">the dot</h1>
  <p id="grownups">Grown-ups: tap the dot, then say yes so the dots can feel tilts and hear claps.</p>
</div>
<button id="start" aria-label="Start the game"></button>
<button id="sound" class="icon-btn" aria-label="Turn sound off">
  <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.2 4.3 18l5 .2 6.4 5.3-.3-17.2-6 5.6z"/><path id="wave" d="M19.5 11c1.6 2.4 1.6 5.4 0 8M23 8c2.9 4.2 2.9 9.8 0 14"/><path id="mute" d="M20 11.5l6 7M26 11.5l-6 7" hidden/></svg>
</button>
<button id="next" class="icon-btn" aria-label="Next page" hidden>
  <svg width="58" height="34" viewBox="0 0 58 34" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18.4c14-1.6 31-1.2 50-.9"/><path d="M42.6 8.2c3.6 3.8 7.2 7 10.8 9.4-3.8 2.4-7.4 5.2-10.2 8.6"/></svg>
</button>

<script>
'use strict';
const $ = id => document.getElementById(id);
const canvas = $('stage'), ctx = canvas.getContext('2d');
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const hypot = Math.hypot;
const TAU = Math.PI * 2;

/* ---------- paint ---------- */
const PAINT = { red: '#D6202E', yellow: '#F5C31C', blue: '#5AA3DB' };
const COLORS = ['red', 'yellow', 'blue'];

function seeded(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16), t = k < 0 ? 0 : 255, m = Math.abs(k);
  const c = s => Math.round(((n >> s) & 255) * (1 - m) + t * m);
  return `${c(16)},${c(8)},${c(0)}`;
}
// One gouache dot: a slightly wonky outline, circular brush drag, dry white streaks, a pale rim where the paint pooled.
function paintDot(hex, seed, size = 512) {
  const rnd = seeded(seed), c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d'), m = size / 2, R = size * 0.47;
  const waves = [2, 3, 4, 5, 7].map((k, i) => [k, rnd() * TAU, (0.012 - i * 0.0015) * (0.5 + rnd())]);
  g.beginPath();
  for (let i = 0; i <= 200; i++) {
    const t = i / 200 * TAU;
    let r = 1; for (const [k, p, a] of waves) r += a * Math.sin(k * t + p);
    g[i ? 'lineTo' : 'moveTo'](m + Math.cos(t) * R * r, m + Math.sin(t) * R * r);
  }
  g.closePath(); g.fillStyle = hex; g.fill(); g.clip();
  g.lineCap = 'round';
  // The brush circles an off-centre point, so the strokes never read as neat target rings.
  const ox = (rnd() - .5) * R * .9, oy = (rnd() - .5) * R * .9;
  for (let i = 0; i < 90; i++) {
    const k = (rnd() - .5) * .22;
    g.strokeStyle = `rgba(${shade(hex, k)},${.05 + rnd() * .14})`;
    g.lineWidth = size * (.012 + rnd() * .05);
    const s = rnd() * TAU;
    g.beginPath(); g.arc(m + ox, m + oy, rnd() * R * 1.5, s, s + .25 + rnd() * 1.1); g.stroke();
  }
  for (let i = 0; i < 9; i++) {
    const s = rnd() * TAU, r0 = R * (.35 + rnd() * .9), span = .08 + rnd() * .3;
    for (let j = 0; j < 5; j++) {
      g.strokeStyle = `rgba(255,255,255,${.06 + rnd() * .3})`;
      g.lineWidth = size * (.001 + rnd() * .004);
      const a = s + rnd() * .06;
      g.beginPath(); g.arc(m + ox, m + oy, r0 + rnd() * size * .025, a, a + span * (.5 + rnd())); g.stroke();
    }
  }
  g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = size * .006;
  const s = rnd() * TAU;
  g.beginPath(); g.arc(m, m, R * .94, s, s + .5 + rnd() * .9); g.stroke();
  return c;
}
const SPRITES = {};
COLORS.forEach((n, i) => { SPRITES[n] = [0, 1, 2].map(v => paintDot(PAINT[n], 11 + i * 17 + v * 101)); });

/* ---------- screen ---------- */
let W = 0, H = 0, U = 0, DPR = 1;
const paper = document.createElement('canvas');
const dark = document.createElement('canvas');
function buildPaper() {
  paper.width = W * DPR; paper.height = H * DPR;
  const g = paper.getContext('2d');
  g.fillStyle = '#FBFAF6'; g.fillRect(0, 0, paper.width, paper.height);
  const rnd = seeded(7), n = Math.floor(W * H / 420);
  for (let i = 0; i < n; i++) {
    g.fillStyle = rnd() > .5 ? 'rgba(120,110,90,.035)' : 'rgba(255,255,255,.5)';
    g.fillRect(rnd() * paper.width, rnd() * paper.height, 1 + rnd() * 2 * DPR, 1 + rnd() * 2 * DPR);
  }
}
// The black layer is kept at normal resolution: it is soft paint, and re-erasing a full-detail layer every frame made the page stutter.
function buildDark() {
  dark.width = W; dark.height = H;
  const g = dark.getContext('2d');
  g.globalCompositeOperation = 'source-over';
  g.fillStyle = '#111215'; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 40; i++) {
    g.strokeStyle = `rgba(255,255,255,${rand(.01, .04)})`; g.lineWidth = rand(1, 5);
    const y = rand(H); g.beginPath(); g.moveTo(0, y); g.lineTo(W, y + rand(-40, 40)); g.stroke();
  }
}
// Where the mic is on the screen right now, and which way it faces from the middle of the page. An iPad has it on its top edge and an iPhone on its bottom edge, wherever those have turned to.
function micSpot() {
  const a = screenAngle() * Math.PI / 180, flip = /iPhone/.test(navigator.userAgent) ? -1 : 1;
  const ux = -Math.sin(a) * flip, uy = -Math.cos(a) * flip;
  return { x: W / 2 + ux * W / 2, y: H / 2 + uy * H / 2, ux, uy };
}
// Three chalk marks pointing at the mic, so children know where to aim. `gap` is how far from the edge they stop.
function drawMicHint(color, alpha, gap = 0) {
  if (alpha <= 0) return;
  const m = micSpot(), size = U * .026, sideX = -m.uy, sideY = m.ux, bob = Math.sin(pageT * 4) * U * .008;
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = U * .007; ctx.lineCap = ctx.lineJoin = 'round';
  for (let i = 0; i < 3; i++) {
    const back = gap + U * (.05 + i * .036) + bob, x = m.x - m.ux * back, y = m.y - m.uy * back;
    const tailX = x - m.ux * size, tailY = y - m.uy * size;
    ctx.globalAlpha = alpha * (1 - i * .28);
    ctx.beginPath();
    ctx.moveTo(tailX + sideX * size, tailY + sideY * size); ctx.lineTo(x, y); ctx.lineTo(tailX - sideX * size, tailY - sideY * size);
    ctx.stroke();
  }
  ctx.restore();
}
// The dark peels away from the mic: a soft-edged wave with dry-brush scratches along its front.
function peelDark(progress, fade, scratches) {
  const m = micSpot(), back = (Math.abs(m.ux) * W + Math.abs(m.uy) * H) * .12, cx = m.x + m.ux * back, cy = m.y + m.uy * back;
  const g = dark.getContext('2d'), far = hypot(Math.max(cx, W - cx), Math.max(cy, H - cy)) * 1.1, inward = Math.atan2(-m.uy, -m.ux);
  const front = Math.max(2, progress * far);
  g.globalCompositeOperation = 'destination-out'; g.lineCap = 'round';
  const wave = g.createRadialGradient(cx, cy, 0, cx, cy, front);
  wave.addColorStop(0, `rgba(0,0,0,${fade})`); wave.addColorStop(.72, `rgba(0,0,0,${fade})`); wave.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = wave; g.fillRect(0, 0, W, H);
  for (let i = 0; i < scratches; i++) {
    const span = rand(.08, .4), s = inward - Math.PI / 2 + rand(.1, Math.PI - .1 - span);
    g.strokeStyle = `rgba(0,0,0,${rand(.35, .9)})`; g.lineWidth = rand(.8, 3.5);
    g.beginPath(); g.arc(cx, cy, Math.max(1, front + rand(-U * .14, U * .05)), s, s + span); g.stroke();
  }
  g.globalCompositeOperation = 'source-over';
}
function scrapeAt(x0, y0, x1, y1) {
  const g = dark.getContext('2d');
  g.globalCompositeOperation = 'destination-out'; g.lineCap = 'round';
  g.strokeStyle = 'rgba(0,0,0,.9)'; g.lineWidth = U * .09;
  g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
  g.globalCompositeOperation = 'source-over';
}
function area() {
  const capH = $('caption').offsetHeight || 80;
  const top = $('sound').offsetTop + 12;
  return { x: 0, y: top, w: W, h: Math.max(80, H - capH - top) };
}
// iOS will not let a web page lock its rotation, so on the tilting pages the game turns itself back the other way instead.
let heldAngle = null;
function screenAngle() { return window.orientation !== undefined ? window.orientation : (screen.orientation ? screen.orientation.angle : 0); }
function heldTurn() { return heldAngle === null ? 0 : heldAngle - screenAngle(); }
function resize() {
  const turn = heldTurn();
  // The new size can arrive just before the new angle. That is a rotation on its way, not a real resize.
  if (!turn && heldAngle !== null && W !== H && W === window.innerHeight && H === window.innerWidth) return;
  document.body.style.cssText = turn ? `position:fixed;left:50%;top:50%;width:${W}px;height:${H}px;transform:translate(-50%,-50%) rotate(${turn}deg)` : '';
  if (turn || (heldAngle !== null && W === window.innerWidth && H === window.innerHeight)) return;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  // A page opened in the background can report zero size, and drawing a zero-size canvas throws.
  W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight); U = Math.min(W, H);
  canvas.width = W * DPR; canvas.height = H * DPR;
  buildPaper(); buildDark();
  if (page && page.layout) page.layout();
  for (const d of dots) { d.hx = clamp(d.hx, 0, W); d.hy = clamp(d.hy, 0, H); }
  if (page && page.night && scraped) for (let i = 0; i < 10; i++) peelDark(scraped, .2, 8);
}

/* ---------- sound ---------- */
const NOTES = { red: [196, 261.6, 293.7], yellow: [329.6, 392, 440], blue: [523.3, 587.3, 659.3] };
const audio = {
  ctx: null, master: null, on: true, quietUntil: 0,
  init() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!this.ctx) {
      this.ctx = new AC();
      // iPads play quietly while the mic is on, so everything is boosted, and a limiter stops the loud moments from crackling.
      this.master = this.ctx.createGain(); this.master.gain.value = 2.4;
      const limit = this.ctx.createDynamicsCompressor();
      limit.threshold.value = -10; limit.knee.value = 8; limit.ratio.value = 8; limit.attack.value = .003; limit.release.value = .15;
      this.master.connect(limit); limit.connect(this.ctx.destination);
    }
    if (this.ctx.state !== 'running') this.ctx.resume().catch(() => {});
  },
  tone(f, dur = .35, vol = .22, type = 'sine', delay = 0) {
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), a = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    a.gain.setValueAtTime(.0001, t); a.gain.exponentialRampToValueAtTime(vol, t + .012);
    a.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(a); a.connect(this.master); o.start(t); o.stop(t + dur + .02);
    this.quietUntil = Math.max(this.quietUntil, performance.now() + (delay + dur) * 1000 + 120);
  },
  note(color) { const f = pick(NOTES[color] || NOTES.yellow); this.tone(f, .4, .24); this.tone(f * 2, .16, .07, 'triangle'); },
  plop() {
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime, o = this.ctx.createOscillator(), a = this.ctx.createGain();
    o.frequency.setValueAtTime(240, t); o.frequency.exponentialRampToValueAtTime(760, t + .12);
    a.gain.setValueAtTime(.26, t); a.gain.exponentialRampToValueAtTime(.0001, t + .18);
    o.connect(a); a.connect(this.master); o.start(t); o.stop(t + .2);
    this.quietUntil = Math.max(this.quietUntil, performance.now() + 300);
  },
  pop() {
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime, o = this.ctx.createOscillator(), a = this.ctx.createGain();
    o.frequency.setValueAtTime(900, t); o.frequency.exponentialRampToValueAtTime(140, t + .1);
    a.gain.setValueAtTime(.3, t); a.gain.exponentialRampToValueAtTime(.0001, t + .13);
    o.connect(a); a.connect(this.master); o.start(t); o.stop(t + .15);
    this.quietUntil = Math.max(this.quietUntil, performance.now() + 250);
  },
  cheer() { [392, 493.9, 587.3, 784].forEach((f, i) => this.tone(f, .34, .17, 'sine', i * .09)); },
  // Short on purpose: the mic stops listening while the game makes a sound, so a long one would miss the next clap.
  clapTone(step) { this.tone([392, 440, 523.3, 587.3, 659.3][step % 5], .09, .24); },
  rattle() { for (let i = 0; i < 7; i++) this.tone(rand(420, 1250), .08, .15, 'triangle', i * .045 + rand(.015)); },
  // True while the game is making noise, so the mic does not mistake it for a clap or a blow.
  busy(now) { return now < this.quietUntil; }

/* ---------- ears ---------- */
const ear = {
  live: false, an: null, level: 0, blow: 0, voice: 0, sustain: 0, floor: .005, avg: .005,
  flat: 0, cand: null, refractory: 0, onClap: null, rms: 0, last: 0,
  power: 0, noise: false, boomAt: 0, pitch: 0, wantPitch: false, quiet: .005,
  attach(source, ctx) {
    if (this.an) this.an.disconnect();
    this.source = source;
    this.an = ctx.createAnalyser();
    this.an.fftSize = 2048; this.an.smoothingTimeConstant = 0;
    source.connect(this.an);

    const silent = ctx.createGain(); silent.gain.value = 0;
    this.an.connect(silent); silent.connect(ctx.destination);
    this.td = new Float32Array(this.an.fftSize);
    this.fd = new Float32Array(this.an.frequencyBinCount);
    this.hz = ctx.sampleRate / this.an.fftSize;
    this.sr = ctx.sampleRate;
    this.yin = new Float32Array(Math.ceil(this.sr / 90) + 2);
    this.live = true;
  },
  // The note being sung, in Hz, or 0 if there is no clear one. This is the YIN method: find the shortest delay at which the
  // sound lines up with itself.
  findPitch() {
    const x = this.td, N = 1024, d = this.yin, minLag = Math.floor(this.sr / 1100), maxLag = Math.min(d.length - 2, x.length - N - 1);
    let run = 0;
    for (let lag = 1; lag <= maxLag; lag++) {
      let s = 0;
      for (let i = 0; i < N; i++) { const v = x[i] - x[i + lag]; s += v * v; }
      run += s; d[lag] = run ? s * lag / run : 1;

    for (let lag = minLag; lag < maxLag; lag++) {
      if (d[lag] >= .15) continue;
      while (lag + 1 < maxLag && d[lag + 1] < d[lag]) lag++;

  },
  update(now) {
    this.level = this.blow = this.voice = this.power = this.pitch = 0;
    this.noise = false;
    if (!this.an) return;
    const dt = Math.min(.1, (now - this.last) / 1000 || .016); this.last = now;
    this.an.getFloatTimeDomainData(this.td);
    let sum = 0; for (let i = 0; i < this.td.length; i++) sum += this.td[i] * this.td[i];
    const rms = this.rms = Math.sqrt(sum / this.td.length);
    if (audio.busy(now)) { this.cand = null; this.sustain = 0; this.avg += (rms - this.avg) * .2; return; }

    this.an.getFloatFrequencyData(this.fd);
    let low = 0, all = 0, logSum = 0, n = 0, arith = 0;
    for (let i = 1; i < this.fd.length; i++) {

    this.floor += (rms - this.floor) * (rms < this.floor ? .03 : .0005);
    this.floor = clamp(this.floor, .0003, .08);

    // fades into "quiet" on the pages that measure how loud or how quiet the children are.
    this.quiet += (rms - this.quiet) * (rms < this.quiet * 2 ? .02 : .00005);

    const db = 20 * Math.log10(Math.max(rms, 1e-7) / Math.max(this.quiet, .0004));

    if (db > 12 && rms > this.avg * 2.5 && now > this.boomAt + 600) this.boomAt = now;

    if (this.cand) {

const stretchPage = {
  text: 'Put two fingers on the dot and stretch it BIG!', arrow: 30,
  enter() { this.done = false; this.goal = 'big'; this.pinch = null; this.step = undefined; this.d = null; this.layout(); },
  layout() {

const countPage = {
  text: 'Clap three times to fill the three circles!', arrow: 40,

  layout() {

const bubblePage = {
  text: 'Blow at the arrows to make bubbles, then pop them all!', arrow: 40,
  enter() { this.done = false; this.bubbles = []; this.popped = 0; this.debt = 0; this.puff = 0; arrange([]); },
  layout() {},
  tick(dt) {

    const m = micSpot(), inward = Math.atan2(-m.uy, -m.ux), A = area();

const pitchPage = {
  text: 'Sing a high, squeaky "eeee" like a mouse to float the dot up into the circle!', arrow: 40, drag: true,
  enter() { this.done = false; this.goal = 1; this.hold = 0; this.y = .5; this.center = 12 * Math.log2(300); ear.wantPitch = true; this.layout(); },
  exit() { ear.wantPitch = false; },
  layout() {
    const A = area(); this.top = A.y + U * .14; this.bottom = A.y + A.h - U * .14; this.x = A.w / 2;
    [this.d] = arrange([{ color: 'blue', x: this.x, y: this.at(this.y), r: U * .07 }]);
  },
  at(y) { return this.bottom + (this.top - this.bottom) * y; },
  tick(dt) {
    const d = this.d; if (this.done || !d) return;

const booPage = {
  text: 'Somebody is peeking! When they all peek out, shout BOO!', arrow: 35,
  enter() { this.done = false; this.scares = 0; this.peek = 0; this.hide = 0; this.seen = ear.boomAt; this.oWas = false; this.tapped = false; this.called = false; this.layout(); },
  layout() {

const bookTwo = [bookTwoStart, trailPage, roarPage, sleepyPage, feedPage, balloonPage, homePage, copyPage, stretchPage, countPage, bubblePage, pitchPage, booPage];

const pages = [
  { text: '', cover: true, enter() { this.layout(); }, layout() {
      arrange([{ color: 'yellow', x: W / 2, y: H / 2, r: U * .1 }]);
    }, tick() { hintWobble(live()); } },
  boopPage('Hello, little dot. Give it a boop.', 1),
  boopPage('Oh! A friend. One more boop.', 2),
  tickleOnce('Tickle the dot with the arrow. Round and round.', 0, 'red', ['yellow', 'yellow', 'yellow']),
  tickleOnce('Hee hee! It went red. Now tickle the dot with the arrow.', 2, 'blue', ['red', 'yellow', 'yellow']),
  fillPage,
  wigglePage,
  leanPage('Hold it flat like a tray. Now tip it to the left. Wheee!', -1),
  leanPage('Now tip it gently over to the right.', 1),
  huntPage('Can you find every blue one? Boop it away!', 'blue'),
  huntPage('Now every red one.', 'red'),
  mixPage('Slide the blue one onto the yellow one.', 'blue', 'yellow', 'Look! Green!'),
  mixPage('Now slide the red one onto the blue one.', 'red', 'blue', 'Purple! Who knew?'),

  nightPage, singPage, clapPage, popPage, bookOneEnd, playPage,

function go(i) {
  if (page && page.exit) page.exit();
  if (!!pages[i].motion !== (heldAngle !== null)) { heldAngle = pages[i].motion ? screenAngle() : null; resize(); }
  page = pages[i]; pageIndex = i; pageT = 0; idleT = 0; timers = [];
  $('next').hidden = true;
  $('caption').textContent = '';
  $('cover').hidden = !page.cover; $('start').hidden = !page.cover;
  if (page.text) $('caption').textContent = page.text;
  if (page.enter) page.enter();
}
let pageIndex = 0, started = false;
function next(delay = 0) { const i = pageIndex; timers.push({ t: delay, fn: () => { if (pageIndex === i) go((i + 1) % pages.length); } }); }

/* ---------- touch ---------- */
const pointers = new Map();
function hit(x, y) {
  const ds = live();
  for (let i = ds.length - 1; i >= 0; i--) {
    const d = ds[i];
    if (hypot(d.x - x, d.y - y) < Math.max(d.r * 1.12, 34)) return d;
  }
  return null;
}
// Where a finger is on the game's own page, which is not where it is on the screen while the game is turned back.
function touchAt(e) {
  const turn = heldTurn();
  if (!turn) return { x: e.clientX, y: e.clientY };
  const a = -turn * Math.PI / 180, dx = e.clientX - window.innerWidth / 2, dy = e.clientY - window.innerHeight / 2;
  return { x: W / 2 + dx * Math.cos(a) - dy * Math.sin(a), y: H / 2 + dx * Math.sin(a) + dy * Math.cos(a) };

canvas.addEventListener('pointerdown', e => {
  audio.init(); idleT = 0; reviveMic();
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* finger already lifted */ }
  const { x, y } = touchAt(e);
  if (page.press) page.press(x, y);
  const d = hit(x, y);
  pointers.set(e.pointerId, { dot: d, x, y, x0: x, y0: y, t: performance.now(), moved: 0 });
  if (d) {
    squish(d); audio.note(d.color);

  }
});
canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId); if (!p) return;
  idleT = 0;
  const { x, y } = touchAt(e);
  const dist = hypot(x - p.x, y - p.y); p.moved += dist;
  if (typeof page.drag === 'function') page.drag(p.x, p.y, x, y);
  const d = p.dot;
  if (d && d.held) {
    d.vx = (x - p.x) * 30; d.vy = (y - p.y) * 30;
    d.x = x; d.y = y; d.hx = d.x; d.hy = d.y;
  } else if (page.rub) {
    const over = hit(x, y);
    if (over) page.rub(over, dist);
  }

});
function endPointer(e) {
  const p = pointers.get(e.pointerId); if (!p) return;
  pointers.delete(e.pointerId);
  if (p.dot && p.dot.held) p.dot.held--;
  const { x, y } = touchAt(e);
  if (p.moved < 14 && performance.now() - p.t < 650 && page.tap) page.tap(p.dot && !p.dot.dead ? p.dot : null, x, y);

canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', e => { const p = pointers.get(e.pointerId); if (p && p.dot && p.dot.held) p.dot.held--; pointers.delete(e.pointerId); });

document.addEventListener('contextmenu', e => e.preventDefault());

// Sensor permission prompts on iPhone and iPad only open from a real click, so the cover is one big button.
$('start').addEventListener('click', () => {
  audio.init();
  if (started) { $('start').hidden = true; audio.plop(); go(1); return; }
  started = true;
  const asks = [];
  if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) asks.push(DeviceOrientationEvent.requestPermission().catch(() => 'denied'));
  if (window.DeviceMotionEvent && DeviceMotionEvent.requestPermission) asks.push(DeviceMotionEvent.requestPermission().catch(() => 'denied'));
  $('start').hidden = true;
  Promise.all(asks).then(() => { sense.listen(); return openMic(); }).finally(() => {
    if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {});
    audio.plop();
    go(1);
  });
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (audio.ctx && audio.ctx.state !== 'running') audio.ctx.resume().catch(() => {});
  setTimeout(reviveMic, 600);
  if (navigator.wakeLock && pageIndex) navigator.wakeLock.request('screen').catch(() => {});
});
$('sound').addEventListener('click', () => {
  audio.on = !audio.on;
  $('wave').toggleAttribute('hidden', !audio.on); $('mute').toggleAttribute('hidden', audio.on);
  $('sound').setAttribute('aria-label', audio.on ? 'Turn sound off' : 'Turn sound on');

$('next').addEventListener('click', () => {
  audio.init();
  if (page === playPage) go(0); else go((pageIndex + 1) % pages.length);

/* Keyboard stands in for the sensors on a computer: arrows tip, S wiggles, C claps, hold B to blow, hold V to sing,

const keysHeld = {};
window.addEventListener('keydown', e => {
  sense.keys[e.key] = true; keysHeld[e.code] = true;
  if (e.repeat) return;
  if (e.code === 'KeyS') triggerShake();
  if (e.code === 'KeyC') triggerClap();
});
window.addEventListener('keyup', e => { sense.keys[e.key] = false; keysHeld[e.code] = false; });
function triggerShake() {
  if (!page || page.cover) return;
  audio.rattle();
  live().forEach(d => { d.wob = .35; });
  if (page.shake) page.shake();
}
function triggerClap() { if (page && page.clap) page.clap(); }
sense.onShake = triggerShake;

/* ---------- loop ---------- */
let lastT = 0;

    // The black fades smoothly over the last stretch of blowing, not all at once at the end.
    const clearing = clamp((scraped - .7) / .3, 0, 1);
    const wantDark = page.night ? 1 - clearing * clearing * (3 - 2 * clearing) : 0;
    nightAlpha += (wantDark - nightAlpha) * Math.min(1, dt * 3);
    if (page.arrow && pageT > page.arrow && !page.done && $('next').hidden) $('next').hidden = false;
  }
  if (sense.jolt > 4 && live().some(d => d.free)) {
    for (const d of live()) if (d.free) { d.vx += rand(-1, 1) * sense.jolt * U * .02; d.vy += rand(-1, 1) * sense.jolt * U * .02; }

window.addEventListener('resize', resize);

for (let i = 0; i < 40; i++) step(1 / 60);

if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (page && page.layout) page.layout(); });

  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
